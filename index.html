<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0A0A0F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Calculadora de arbitraje crypto - circuito completo">
  <title>Calculadora de Arbitraje</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header class="header">
      <h1 class="logo">Calculadora<span class="logo-accent">Arbitraje</span></h1>
    </header>

    <!-- PASO 1: Capital inicial -->
    <section class="section">
      <h2 class="section-title">Capital Inicial</h2>
      <div class="input-row">
        <div class="input-group full">
          <label>Monto a invertir (USD)</label>
          <input type="number" id="capital" value="1000" min="0" step="1" inputmode="decimal">
        </div>
      </div>
    </section>

    <!-- PASO 2: Compra -->
    <section class="section">
      <h2 class="section-title">1. Compra</h2>
      <div class="input-row">
        <div class="input-group flex1">
          <label>Plataforma</label>
          <select id="buyPlatform">
            <option value="binance">Binance</option>
            <option value="bybit">Bybit</option>
            <option value="kucoin">KuCoin</option>
            <option value="kraken">Kraken</option>
            <option value="gate">Gate.io</option>
            <option value="okx">OKX</option>
            <option value="mexc">MEXC</option>
            <option value="bitget">Bitget</option>
            <option value="coinbase">Coinbase</option>
            <option value="p2p">P2P / OTC</option>
            <option value="otro">Otro</option>
          </select>
        </div>
        <div class="input-group flex1">
          <label>Crypto / Par</label>
          <input type="text" id="buyPair" value="BTC/USDT" placeholder="BTC/USDT">
        </div>
      </div>
      <div class="input-row">
        <div class="input-group flex1">
          <label>Precio de compra (USD)</label>
          <input type="number" id="buyPrice" placeholder="67000" min="0" step="any" inputmode="decimal">
        </div>
        <div class="input-group flex1">
          <label>Comision compra (%)</label>
          <input type="number" id="buyFee" value="0.1" min="0" step="0.01" inputmode="decimal">
        </div>
      </div>
    </section>

    <!-- PASO 3: Transferencia -->
    <section class="section">
      <h2 class="section-title">2. Transferencia</h2>
      <div class="input-row">
        <div class="input-group flex1">
          <label>Fee de retiro (USD)</label>
          <input type="number" id="withdrawFee" value="1" min="0" step="0.01" inputmode="decimal">
        </div>
        <div class="input-group flex1">
          <label>Fee de deposito (USD)</label>
          <input type="number" id="depositFee" value="0" min="0" step="0.01" inputmode="decimal">
        </div>
      </div>
    </section>

    <!-- PASO 4: Venta -->
    <section class="section">
      <h2 class="section-title">3. Venta</h2>
      <div class="input-row">
        <div class="input-group flex1">
          <label>Plataforma</label>
          <select id="sellPlatform">
            <option value="binance">Binance</option>
            <option value="bybit" selected>Bybit</option>
            <option value="kucoin">KuCoin</option>
            <option value="kraken">Kraken</option>
            <option value="gate">Gate.io</option>
            <option value="okx">OKX</option>
            <option value="mexc">MEXC</option>
            <option value="bitget">Bitget</option>
            <option value="coinbase">Coinbase</option>
            <option value="p2p">P2P / OTC</option>
            <option value="otro">Otro</option>
          </select>
        </div>
        <div class="input-group flex1">
          <label>Precio de venta (USD)</label>
          <input type="number" id="sellPrice" placeholder="67350" min="0" step="any" inputmode="decimal">
        </div>
      </div>
      <div class="input-row">
        <div class="input-group flex1">
          <label>Comision venta (%)</label>
          <input type="number" id="sellFee" value="0.1" min="0" step="0.01" inputmode="decimal">
        </div>
      </div>
    </section>

    <!-- PASO 5: Recompra (circuito completo) -->
    <section class="section">
      <h2 class="section-title">4. Recompra (volver al activo)</h2>
      <div class="toggle-row">
        <label class="toggle-label">Incluir recompra en el calculo</label>
        <label class="switch">
          <input type="checkbox" id="includeRebuy" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div id="rebuySection">
        <div class="input-row">
          <div class="input-group flex1">
            <label>Plataforma recompra</label>
            <select id="rebuyPlatform">
              <option value="binance" selected>Binance</option>
              <option value="bybit">Bybit</option>
              <option value="kucoin">KuCoin</option>
              <option value="kraken">Kraken</option>
              <option value="gate">Gate.io</option>
              <option value="okx">OKX</option>
              <option value="mexc">MEXC</option>
              <option value="bitget">Bitget</option>
              <option value="coinbase">Coinbase</option>
              <option value="p2p">P2P / OTC</option>
              <option value="otro">Otro</option>
            </select>
          </div>
          <div class="input-group flex1">
            <label>Precio recompra (USD)</label>
            <input type="number" id="rebuyPrice" placeholder="67000" min="0" step="any" inputmode="decimal">
          </div>
        </div>
        <div class="input-row">
          <div class="input-group flex1">
            <label>Comision recompra (%)</label>
            <input type="number" id="rebuyFee" value="0.1" min="0" step="0.01" inputmode="decimal">
          </div>
          <div class="input-group flex1">
            <label>Fee retorno (USD)</label>
            <input type="number" id="returnFee" value="1" min="0" step="0.01" inputmode="decimal">
          </div>
        </div>
      </div>
    </section>

    <!-- Boton calcular -->
    <button class="calc-btn" onclick="calculate()">Calcular Arbitraje</button>

    <!-- Resultados -->
    <section class="results-section" id="resultsSection" style="display:none;">
      <h2 class="section-title">Resultado</h2>

      <!-- Resumen rapido -->
      <div class="result-summary" id="resultSummary">
        <div class="result-main" id="resultMain"></div>
        <div class="result-percent" id="resultPercent"></div>
      </div>

      <!-- Circuito visual -->
      <div class="circuit" id="circuit"></div>

      <!-- Desglose detallado -->
      <div class="breakdown" id="breakdown"></div>
    </section>

    <!-- Historial -->
    <section class="section" id="historySection" style="display:none;">
      <h2 class="section-title">Historial de Calculos</h2>
      <div id="historyList"></div>
      <button class="clear-btn" onclick="clearHist()">Borrar Historial</button>
    </section>

  </div>

  <script src="js/calculator.js"></script>
</body>
</html>
