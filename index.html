<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0A0A0F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Detector de arbitraje crypto y forex en tiempo real">
  <title>Arbitraje Detector</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <h1 class="logo">Arbitraje</h1>
        <span class="logo-accent">Detector</span>
      </div>
      <div class="status-pill" id="statusPill">
        <span class="pulse-dot" id="pulseDot"></span>
        <span id="statusText">Inactivo</span>
      </div>
    </header>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <span class="stat-value" id="statScans">0</span>
        <span class="stat-label">Escaneos</span>
      </div>
      <div class="stat-card">
        <span class="stat-value stat-green" id="statProfitable">0</span>
        <span class="stat-label">Rentables</span>
      </div>
      <div class="stat-card">
        <span class="stat-value stat-blue" id="statBestScore">0</span>
        <span class="stat-label">Mejor Score</span>
      </div>
    </div>

    <!-- Control -->
    <button class="control-btn" id="controlBtn" onclick="toggleScanning()">
      ▶ Iniciar Monitoreo
    </button>

    <!-- Tabs -->
    <nav class="tabs">
      <button class="tab active" data-tab="opportunities" onclick="switchTab('opportunities')">Oportunidades</button>
      <button class="tab" data-tab="history" onclick="switchTab('history')">Historial</button>
      <button class="tab" data-tab="settings" onclick="switchTab('settings')">Config</button>
    </nav>

    <!-- Opportunities Tab -->
    <section class="tab-content active" id="tab-opportunities">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🔍</div>
        <p class="empty-text">Buscando oportunidades...</p>
        <p class="empty-subtext">Las mejores aparecen en momentos de alta volatilidad</p>
      </div>
      <div id="opportunitiesList"></div>
    </section>

    <!-- History Tab -->
    <section class="tab-content" id="tab-history">
      <div class="empty-state" id="historyEmpty">
        <div class="empty-icon">📋</div>
        <p class="empty-text">Sin historial aun</p>
        <p class="empty-subtext">Las oportunidades rentables se guardaran aqui</p>
      </div>
      <div id="historyList"></div>
    </section>

    <!-- Settings Tab -->
    <section class="tab-content" id="tab-settings">
      <div class="settings-section">
        <h3 class="section-title">Simulacion</h3>
        <div class="input-group">
          <label>Monto de inversion (USD)</label>
          <input type="number" id="cfgInvestment" value="1000">
        </div>
      </div>
      <div class="settings-section">
        <h3 class="section-title">Umbrales</h3>
        <div class="input-group">
          <label>Min. profit inter-exchange (%)</label>
          <input type="number" id="cfgMinProfit" value="0.3" step="0.1">
        </div>
        <div class="input-group">
          <label>Min. profit triangular (%)</label>
          <input type="number" id="cfgMinTriangular" value="0.2" step="0.1">
        </div>
      </div>
      <div class="settings-section">
        <h3 class="section-title">Costos Estimados</h3>
        <div class="input-group">
          <label>Fee de trading (%)</label>
          <input type="number" id="cfgTradingFee" value="0.1" step="0.01">
        </div>
        <div class="input-group">
          <label>Slippage (%)</label>
          <input type="number" id="cfgSlippage" value="0.05" step="0.01">
        </div>
      </div>
      <div class="settings-section">
        <h3 class="section-title">Escaneo</h3>
        <div class="input-group">
          <label>Intervalo entre escaneos (segundos)</label>
          <input type="number" id="cfgInterval" value="15">
        </div>
      </div>
      <div class="settings-section">
        <h3 class="section-title">Exchanges activos</h3>
        <div class="checkbox-group">
          <label><input type="checkbox" value="binance" checked> Binance</label>
          <label><input type="checkbox" value="kraken" checked> Kraken</label>
          <label><input type="checkbox" value="bybit" checked> Bybit</label>
          <label><input type="checkbox" value="kucoin" checked> KuCoin</label>
          <label><input type="checkbox" value="gate" checked> Gate.io</label>
          <label><input type="checkbox" value="okx"> OKX</label>
          <label><input type="checkbox" value="mexc"> MEXC</label>
        </div>
      </div>
      <button class="save-btn" onclick="saveSettings()">Guardar Cambios</button>
      <button class="clear-btn" onclick="clearHistory()">Borrar Historial</button>
    </section>
  </div>

  <!-- Detail Modal -->
  <div class="modal" id="detailModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">← Volver</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
