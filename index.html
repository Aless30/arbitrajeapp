<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0A0A0F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Calculadora Arbitraje</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <header class="header">
      <h1 class="logo">Calculadora<span class="logo-accent">Arbitraje</span></h1>
    </header>

    <!-- Capital -->
    <section class="section">
      <div class="input-row">
        <div class="input-group full">
          <label>Capital (ARS)</label>
          <input type="number" id="capital" value="1000000" inputmode="decimal">
        </div>
      </div>
    </section>

    <!-- Compra -->
    <section class="section">
      <h2 class="section-title">1. Compra</h2>
      <div class="input-row">
        <div class="input-group flex1">
          <label>Plataforma</label>
          <select id="buyPlatform" onchange="onPlatformChange()">
            <option value="binance_p2p">Binance P2P</option>
            <option value="okx_p2p">OKX P2P</option>
            <option value="bybit_p2p">Bybit P2P</option>
            <option value="kucoin_p2p">KuCoin P2P</option>
            <option value="bitget_p2p">Bitget P2P</option>
            <option value="lemon">Lemon Cash</option>
            <option value="belo">Belo</option>
            <option value="buenbit">Buenbit</option>
            <option value="ripio">Ripio</option>
            <option value="fiwind">Fiwind</option>
            <option value="tiendacrypto">TiendaCrypto</option>
          </select>
        </div>
        <div class="input-group flex1">
          <label>Precio compra (ARS)</label>
          <input type="number" id="buyPrice" placeholder="1250" inputmode="decimal">
        </div>
      </div>
      <div class="fee-auto" id="buyFeeInfo"></div>
    </section>

    <!-- Transferencia -->
    <section class="section">
      <h2 class="section-title">2. Envio</h2>
      <div class="input-row">
        <div class="input-group flex1">
          <label>Red</label>
          <select id="network" onchange="onNetworkChange()">
            <option value="trc20">TRC20 (USDT)</option>
            <option value="bep20">BEP20 (BSC)</option>
            <option value="polygon">Polygon</option>
            <option value="solana">Solana</option>
            <option value="ton">TON</option>
            <option value="arbitrum">Arbitrum</option>
            <option value="erc20">ERC20 (caro)</option>
          </select>
        </div>
        <div class="input-group flex1">
          <label>Fee retiro (crypto)</label>
          <input type="number" id="withdrawFee" value="1" inputmode="decimal">
        </div>
      </div>
    </section>

    <!-- Venta -->
    <section class="section">
      <h2 class="section-title">3. Venta</h2>
      <div class="input-row">
        <div class="input-group flex1">
          <label>Plataforma</label>
          <select id="sellPlatform" onchange="onPlatformChange()">
            <option value="okx_p2p" selected>OKX P2P</option>
            <option value="binance_p2p">Binance P2P</option>
            <option value="bybit_p2p">Bybit P2P</option>
            <option value="kucoin_p2p">KuCoin P2P</option>
            <option value="bitget_p2p">Bitget P2P</option>
            <option value="lemon">Lemon Cash</option>
            <option value="belo">Belo</option>
            <option value="buenbit">Buenbit</option>
            <option value="ripio">Ripio</option>
            <option value="fiwind">Fiwind</option>
            <option value="tiendacrypto">TiendaCrypto</option>
          </select>
        </div>
        <div class="input-group flex1">
          <label>Precio venta (ARS)</label>
          <input type="number" id="sellPrice" placeholder="1280" inputmode="decimal">
        </div>
      </div>
      <div class="fee-auto" id="sellFeeInfo"></div>
    </section>

    <!-- Recompra toggle -->
    <section class="section">
      <div class="toggle-row">
        <label class="toggle-label">Incluir recompra (circuito completo)</label>
        <label class="switch">
          <input type="checkbox" id="includeRebuy">
          <span class="slider"></span>
        </label>
      </div>
      <div id="rebuySection" style="display:none;">
        <h2 class="section-title">4. Recompra</h2>
        <div class="input-row">
          <div class="input-group flex1">
            <label>Plataforma</label>
            <select id="rebuyPlatform" onchange="onPlatformChange()">
              <option value="binance_p2p">Binance P2P</option>
              <option value="okx_p2p">OKX P2P</option>
              <option value="bybit_p2p">Bybit P2P</option>
              <option value="kucoin_p2p">KuCoin P2P</option>
              <option value="bitget_p2p">Bitget P2P</option>
              <option value="lemon">Lemon Cash</option>
              <option value="belo">Belo</option>
              <option value="buenbit">Buenbit</option>
              <option value="ripio">Ripio</option>
              <option value="fiwind">Fiwind</option>
              <option value="tiendacrypto">TiendaCrypto</option>
            </select>
          </div>
          <div class="input-group flex1">
            <label>Precio recompra (ARS)</label>
            <input type="number" id="rebuyPrice" placeholder="1250" inputmode="decimal">
          </div>
        </div>
        <div class="fee-auto" id="rebuyFeeInfo"></div>
      </div>
    </section>

    <button class="calc-btn" onclick="calculate()">Calcular</button>

    <!-- Resultado -->
    <section id="resultsSection" style="display:none;">
      <div class="result-summary" id="resultSummary">
        <div class="result-main" id="resultMain"></div>
        <div class="result-percent" id="resultPercent"></div>
      </div>
      <div class="circuit" id="circuit"></div>
      <div class="breakdown" id="breakdown"></div>
    </section>

    <!-- Historial -->
    <section class="section" id="historySection" style="display:none;">
      <h2 class="section-title">Historial</h2>
      <div id="historyList"></div>
      <button class="clear-btn" onclick="clearHist()">Borrar</button>
    </section>

  </div>
  <script src="js/calculator.js"></script>
</body>
</html>
